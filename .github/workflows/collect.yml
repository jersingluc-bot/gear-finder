name: collect
# Reads every shop and publishes the catalogue the apps download. Runs daily; can also be started by hand.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      # GitHub pauses scheduled workflows in a repo with no commits for 60 days; re-enabling
      # the workflow on every run resets that clock, so the daily crawl never stops on its own.
      - name: Keep the daily schedule alive
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
        env: { GH_TOKEN: "${{ github.token }}" }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      # Pages read on earlier runs, so a run that is cut short or refused still has every product.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: crawl-cache-${{ github.run_id }}
          restore-keys: crawl-cache-
      - name: Fetch the previous catalogue (for the publish check)
        run: |
          mkdir -p data/catalogue
          gh release download catalogue --dir data/catalogue --clobber || true
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Build the collector
        run: ./gradlew :collector:installDist -q -Dorg.gradle.java.home="$JAVA_HOME"
      - name: Crawl and merge
        # Alpine Trek has about 45,000 pages; the budget spreads its first full read over several runs.
        run: collector/build/install/collector/bin/collector --out data/catalogue --cache data/cache --budget 9000
      - name: Publish
        run: |
          gh release view catalogue >/dev/null 2>&1 || gh release create catalogue --title "Catalogue" --notes "Product catalogue downloaded by the Gear Finder apps. Rebuilt automatically."
          gh release upload catalogue data/catalogue/meta.json data/catalogue/index.jsonl.gz data/catalogue/products.jsonl.gz --clobber
        env: { GH_TOKEN: "${{ github.token }}" }
